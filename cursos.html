<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - TechConnect</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        // Aplica o tema salvo antes da página aparecer (evita piscar).
        document.documentElement.dataset.tema = localStorage.getItem("tc_tema")
            || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro");
    </script>
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="page-head">
            <div class="container">
                <h1 class="section-title">Todos os cursos</h1>
                <p id="contagem"></p>
            </div>
        </section>

        <div class="container">
            <div class="chips" id="chips"></div>
            <div class="grid" id="grid"></div>
            <p class="empty" id="vazio" hidden>
                Nenhum curso encontrado. Tente outra palavra ou escolha "Todos".
            </p>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
